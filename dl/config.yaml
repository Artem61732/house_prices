# DL-конфиг: гиперпараметры DNN, эксперименты (dl/main.py), Optuna (dl/tune.py).
# cat_encoding: embedding | onehot | freq | target

dl:
  cat_encoding: "freq"
  cv_strategy: "stratified"
  stratify_bins: 10
  batch_size: 64
  n_epochs: 100
  learning_rate: 0.001
  patience: 15
  device: "auto"
  loss_fn: "mse"
  optimizer: "adam"
  scheduler: "cosine"

  tune:
    n_trials: 50
    n_epochs: 80
    patience: 10
    search_space: "refined"  # refined | wide

  experiments:
    - name: "baseline_2layer"
      hidden_layers: [128, 64]
      activation: "relu"
      batch_norm: false
      dropout: 0.0
      cat_encoding: "freq"

    - name: "deep_4layer"
      hidden_layers: [256, 128, 64, 32]
      activation: "relu"
      batch_norm: false
      dropout: 0.0
      cat_encoding: "freq"

    - name: "batchnorm"
      hidden_layers: [256, 128, 64]
      activation: "relu"
      batch_norm: true
      dropout: 0.0
      cat_encoding: "freq"

    - name: "dropout_0.2"
      hidden_layers: [256, 128, 64]
      activation: "relu"
      batch_norm: true
      dropout: 0.2
      cat_encoding: "freq"

    - name: "dropout_0.5"
      hidden_layers: [256, 128, 64]
      activation: "relu"
      batch_norm: true
      dropout: 0.5
      cat_encoding: "freq"

    - name: "elu_wide"
      hidden_layers: [512, 256, 128]
      activation: "elu"
      batch_norm: true
      dropout: 0.3
      cat_encoding: "freq"

    - name: "sgd_cosine"
      hidden_layers: [256, 128, 64]
      activation: "relu"
      batch_norm: true
      dropout: 0.2
      cat_encoding: "freq"
      optimizer: "sgd"
      scheduler: "cosine"
      learning_rate: 0.01

    - name: "adamw_mse"
      hidden_layers: [256, 128, 64]
      activation: "relu"
      batch_norm: true
      dropout: 0.2
      cat_encoding: "freq"
      optimizer: "adamw"
      loss_fn: "mse"
      learning_rate: 0.0005
      batch_size: 32
      n_epochs: 150

    - name: "embeddings"
      hidden_layers: [256, 128, 64]
      activation: "relu"
      batch_norm: true
      dropout: 0.2
      cat_encoding: "embedding"
