# Общий конфиг: paths, random_state, cv, preprocess.
# ML-специфичное — ml/config.yaml, DL — dl/config.yaml.

paths:
  train: "data/train.csv"
  test: "data/test.csv"
  submission: "submission.csv"
  dl_submission: "submission_dl.csv"

random_state: 42

cv:
  n_splits: 5

preprocess:
  skew_threshold: 0.75  # |skew| > threshold → log1p (считается на train)
