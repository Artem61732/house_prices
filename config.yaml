# =============================================================================
# ОБЩИЙ КОНФИГ (источник правды для ML и DL)
# =============================================================================
# Менять здесь:
#   - paths          пути к данным и сабмитам
#   - random_state   воспроизводимость (CV, модели, Optuna)
#   - cv.n_splits    число фолдов для всех пайплайнов
#   - preprocess     общий feature engineering
#
# НЕ менять здесь (см. ml/config.yaml и dl/config.yaml):
#   - blend.weights  веса ML-бленда (ручные, не из тюнинга)
#   - tune           Optuna для ML
#   - dl.*           всё, что касается DNN
# =============================================================================

paths:
  train: "data/train.csv"       # обучающая выборка Kaggle
  test: "data/test.csv"         # тест для инференса
  submission: "submission.csv"      # сабмит ML-пайплайна
  dl_submission: "submission_dl.csv"  # сабмит DL-пайплайна

random_state: 42  # сид для KFold, моделей, Optuna

cv:
  n_splits: 5  # KFold / StratifiedKFold — общий для ML и DL

preprocess:
  skew_threshold: 0.75  # порог |skew| для log1p (считается на train)
