# config.yaml

paths:
  train: "data/train.csv"
  test: "data/test.csv"
  submission: "submission.csv"

split:
  test_size: 0.2
  random_state: 42

cv:
  n_splits: 5
  random_state: 42

tune:
  n_trials: 30

features:
  remove_outliers: true
  max_area: 4000      # порог отсечения выбросов по площади

models:
  random_state: 42