# =============================================================================
# ML-КОНФИГ
# =============================================================================
# blend.weights — РУЧНЫЕ веса для финального сабмита (ml/create_submission.py).
#   Не подбираются Optuna и не читаются из ml/best_params.json.
#   Подбор весов на OOF — только в ml/main.py (find_blend_weights), для анализа.
#
# tune — дефолты Optuna-тюнинга ML-моделей (ml/tune.py).
#   Лучшие параметры моделей сохраняются в ml/best_params.json.
# =============================================================================

blend:
  weights:
    catboost: 0.30
    ridge:    0.45
    lightgbm: 0.25

tune:
  n_trials: 30  # число trials Optuna по умолчанию для CatBoost/Ridge/LightGBM
